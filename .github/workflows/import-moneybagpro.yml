name: Import full MoneyBagPro source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download original MoneyBagPro repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/moneybagpro
          mkdir -p /tmp/moneybagpro
          curl -L --fail --retry 3 https://github.com/learninghub44/moneybagpro/archive/refs/heads/main.tar.gz -o /tmp/moneybagpro/source.tar.gz
          tar -xzf /tmp/moneybagpro/source.tar.gz -C /tmp/moneybagpro
          test -d /tmp/moneybagpro/moneybagpro-main

      - name: Replace target contents with original app
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/moneybagpro/moneybagpro-main/. .
          rm -rf .github/workflows
          test -f package.json
          test -f src/main.tsx

      - name: Commit complete deployable application
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Import full deployable MoneyBagPro application"
          git push origin HEAD:main
